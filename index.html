<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Polygraph Monitor</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010406;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    display: flex;
}

.monitor {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background:
        linear-gradient(145deg,#172127,#060b0e 45%,#11191e);
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    height: 64px;
    min-height: 64px;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 2px solid #26343c;
    background:
        linear-gradient(#172128,#090e12);
    letter-spacing: 2px;
}

.status-light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #2bea78;
    box-shadow: 0 0 14px #2bea78;
    margin-right: 15px;
}

.title {
    font-size: 20px;
    color: #dce5e9;
    font-weight: 500;
}

.recording {
    margin-left: auto;
    color: #9daab0;
    font-size: 13px;
    letter-spacing: 1px;
}

.record-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 8px;
    border-radius: 50%;
    background: #ed3535;
    box-shadow: 0 0 10px #ed3535;
    animation: recordPulse 1s infinite;
}

@keyframes recordPulse {
    50% {
        opacity: .35;
    }
}

/* =====================================================
   MAIN DISPLAY
===================================================== */

.screen {
    flex: 1;
    min-height: 0;
    margin: 16px;
    border: 2px solid #263b45;
    border-radius: 7px;
    background: #02080b;
    overflow: hidden;
    display: flex;
}

.channels {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0,1fr) 190px;
}

.traces {
    min-width: 0;
    height: 100%;
}

.channel {
    height: 25%;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #173039;

    background-image:
        linear-gradient(rgba(35,83,99,.18) 1px,transparent 1px),
        linear-gradient(90deg,rgba(35,83,99,.18) 1px,transparent 1px);

    background-size: 25px 25px;
}

.channel:last-child {
    border-bottom: none;
}

.channel canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.label {
    position: absolute;
    z-index: 5;
    top: 14px;
    left: 20px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 1px 3px #000;
}

.unit {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    opacity: .7;
    font-weight: normal;
}

.heart-label {
    color: #35ee78;
}

.pressure-label {
    color: #ff4242;
}

.resp-label {
    color: #31aaff;
}

.skin-label {
    color: #ffd429;
}

/* =====================================================
   NUMERICAL READOUTS
===================================================== */

.readouts {
    border-left: 2px solid #173039;
    background: #04090c;
    display: flex;
    flex-direction: column;
}

.readout {
    flex: 1;
    min-height: 0;
    padding: 16px;
    border-bottom: 1px solid #182a32;
}

.readout:last-child {
    border-bottom: none;
}

.readout-name {
    color: #78878e;
    font-size: 11px;
    letter-spacing: 1px;
}

.readout-value {
    margin-top: 7px;
    font-family: "Courier New",monospace;
    font-size: 36px;
    line-height: 1;
}

.green {
    color: #38e875;
}

.red {
    color: #ff3c3c;
}

.blue {
    color: #35aaff;
}

.yellow {
    color: #ffd52a;
}

/* =====================================================
   ANALYSIS / CONFIDENCE
===================================================== */

.analysis {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    z-index: 20;

    min-width: 280px;
    padding: 15px 25px;

    text-align: center;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 5px;

    background: rgba(2,8,11,.88);
    box-shadow: 0 0 35px rgba(0,0,0,.7);

    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
}

.analysis.visible {
    opacity: 1;
}

.analysis-title {
    font-size: 15px;
    letter-spacing: 4px;
    color: #d5e0e4;
}

.analysis-status {
    margin-top: 8px;
    font-family: "Courier New",monospace;
    font-size: 12px;
    color: #55df8a;
}

.confidence {
    margin-top: 13px;
    height: 5px;
    background: #16252b;
    overflow: hidden;
    border-radius: 4px;
}

.confidence-bar {
    height: 100%;
    width: 0%;
    background: #42df80;
    box-shadow: 0 0 8px #42df80;
}

/* =====================================================
   VERDICT
===================================================== */

.verdict {
    height: 150px;
    min-height: 150px;
    margin: 0 16px 16px;

    border: 3px solid #263941;
    border-radius: 10px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #04090b;

    transition:
        background .2s,
        border-color .2s,
        box-shadow .2s;
}

.verdict-text {
    font-family: Impact,"Arial Black",sans-serif;
    font-size: clamp(60px,10vw,115px);
    letter-spacing: 10px;
    color: #26343a;

    transition:
        color .2s,
        text-shadow .2s;
}

.verdict.lie {
    border-color: #a01818;

    background:
        radial-gradient(
            circle,
            rgba(220,0,0,.45),
            transparent 68%
        ),
        #170203;

    box-shadow:
        inset 0 0 45px rgba(255,0,0,.25),
        0 0 25px rgba(255,0,0,.15);
}

.verdict.lie .verdict-text {
    color: #ff2222;

    text-shadow:
        0 0 8px #ff2222,
        0 0 25px #ff0000,
        0 0 50px rgba(255,0,0,.6);
}

.verdict.true {
    border-color: #15713d;

    background:
        radial-gradient(
            circle,
            rgba(0,180,75,.3),
            transparent 68%
        ),
        #031009;

    box-shadow:
        inset 0 0 40px rgba(0,255,100,.13);
}

.verdict.true .verdict-text {
    color: #34ed79;

    text-shadow:
        0 0 8px #34ed79,
        0 0 25px rgba(0,255,100,.65);
}

/* =====================================================
   OPERATOR PANEL
===================================================== */

.operator {
    position: fixed;
    z-index: 100;

    top: 20px;
    left: 20px;

    width: 280px;

    padding: 18px;

    border: 1px solid #4b5c64;
    border-radius: 8px;

    background: rgba(7,13,17,.97);

    box-shadow: 0 15px 50px #000;

    display: none;
}

.operator.open {
    display: block;
}

.operator h3 {
    margin: 0 0 14px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #dbe4e7;
}

.operator button {
    width: 100%;
    height: 42px;
    margin-top: 8px;

    border: 1px solid #35464e;
    border-radius: 5px;

    background: #111c21;
    color: white;

    cursor: pointer;
    font-size: 13px;
}

.operator button:hover {
    background: #1b2a31;
}

.operator .op-lie {
    border-color: #8c2525;
}

.operator .op-true {
    border-color: #247447;
}

.operator .op-auto {
    border-color: #465860;
}

.operator-status {
    margin-top: 13px;
    color: #89979d;
    font-size: 11px;
    line-height: 1.5;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .topbar {
        height: 48px;
        min-height: 48px;
        padding: 0 12px;
    }

    .title {
        font-size: 14px;
    }

    .recording {
        font-size: 10px;
    }

    .screen {
        margin: 8px;
    }

    .channels {
        grid-template-columns: 1fr 105px;
    }

    .readout {
        padding: 9px;
    }

    .readout-value {
        font-size: 22px;
    }

    .label {
        left: 10px;
        top: 9px;
        font-size: 9px;
    }

    .unit {
        font-size: 8px;
    }

    .verdict {
        height: 95px;
        min-height: 95px;
        margin: 0 8px 8px;
    }
}
</style>
</head>

<body>

<div class="monitor">

    <div class="topbar">

        <div class="status-light"></div>

        <div class="title">
            POLYGRAPH MONITOR
        </div>

        <div class="recording">
            <span class="record-dot"></span>
            RECORDING...
        </div>

    </div>


    <div class="screen">

        <div class="channels">

            <div class="traces">

                <div class="channel">

                    <div class="label heart-label
