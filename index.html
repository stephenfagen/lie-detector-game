<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polygraph Monitor</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background: #020609;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.monitor {
    width: min(1200px, 100%);
    background: linear-gradient(145deg,#1c252b,#080d11 45%,#111a20);
    border: 3px solid #34434c;
    border-radius: 14px;
    box-shadow:
        0 0 0 5px #070b0e,
        0 25px 70px rgba(0,0,0,.8),
        inset 0 0 30px rgba(255,255,255,.03);
    overflow: hidden;
}

.topbar {
    height: 58px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-bottom: 2px solid #26343c;
    background: linear-gradient(#172128,#0b1115);
    letter-spacing: 2px;
}

.status-light {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #28e875;
    box-shadow: 0 0 12px #28e875;
    margin-right: 14px;
}

.title {
    font-size: 18px;
    color: #d7e0e5;
}

.recording {
    margin-left: auto;
    color: #b7c2c7;
    font-size: 13px;
}

.record-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #ef3838;
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 8px #ef3838;
}

.screen {
    margin: 18px;
    background: #02080b;
    border: 2px solid #24363f;
    border-radius: 7px;
    overflow: hidden;
}

.channels {
    display: grid;
    grid-template-columns: 1fr 170px;
}

.traces {
    position: relative;
}

.channel {
    height: 145px;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #183039;

    background-image:
        linear-gradient(rgba(30,75,90,.18) 1px,transparent 1px),
        linear-gradient(90deg,rgba(30,75,90,.18) 1px,transparent 1px);
    background-size: 25px 25px;
}

.channel:last-child {
    border-bottom: none;
}

.label {
    position: absolute;
    top: 17px;
    left: 18px;
    z-index: 3;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.unit {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    opacity: .7;
    font-weight: normal;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.heart-label { color:#37ed78; }
.pressure-label { color:#ff4141; }
.resp-label { color:#28a9ff; }
.skin-label { color:#ffd426; }

.readouts {
    border-left: 2px solid #183039;
    background: #050a0d;
    display: flex;
    flex-direction: column;
}

.readout {
    flex: 1;
    min-height: 100px;
    border-bottom: 1px solid #18282f;
    padding: 15px;
}

.readout:last-child {
    border-bottom: none;
}

.readout-name {
    font-size: 11px;
    letter-spacing: 1px;
    color: #8c9aa0;
}

.readout-value {
    font-family: "Courier New", monospace;
    font-size: 32px;
    margin-top: 8px;
}

.green { color:#38e875; }
.red { color:#ff3d3d; }
.blue { color:#36aaff; }
.yellow { color:#ffd62d; }

.verdict {
    margin: 0 18px 18px;
    height: 135px;
    border: 3px solid #263941;
    border-radius: 10px;
    background: #05090b;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: .25s;
}

.verdict-text {
    font-family: Impact,"Arial Black",sans-serif;
    font-size: clamp(55px,10vw,105px);
    letter-spacing: 8px;
    color: #314047;
    transition: .25s;
}

.verdict.lie {
    border-color: #9d1616;
    background:
        radial-gradient(circle,rgba(220,0,0,.45),transparent 65%),
        #160203;
    box-shadow:
        inset 0 0 35px rgba(255,0,0,.25),
        0 0 25px rgba(255,0,0,.15);
}

.verdict.lie .verdict-text {
    color:#ff2020;
    text-shadow:
        0 0 8px #ff2020,
        0 0 25px rgba(255,0,0,.8);
}

.verdict.true {
    border-color:#16713d;
    background:
        radial-gradient(circle,rgba(0,170,70,.3),transparent 65%),
        #031009;
    box-shadow:inset 0 0 30px rgba(0,255,100,.12);
}

.verdict.true .verdict-text {
    color:#32ed78;
    text-shadow:
        0 0 8px #32ed78,
        0 0 25px rgba(0,255,100,.6);
}

@media(max-width:700px) {
    body { padding:8px; }

    .channels {
        grid-template-columns:1fr;
    }

    .readouts {
        display:grid;
        grid-template-columns:repeat(4,1fr);
        border-left:none;
        border-top:2px solid #183039;
    }

    .readout {
        min-height:75px;
        padding:9px;
    }

    .readout-value {
        font-size:22px;
    }

    .channel {
        height:115px;
    }

    .verdict {
        height:105px;
    }
}
</style>
</head>

<body>

<div class="monitor">

    <div class="topbar">
        <div class="status-light"></div>
        <div class="title">POLYGRAPH MONITOR</div>

        <div class="recording">
            <span class="record-dot"></span>
            RECORDING...
        </div>
    </div>

    <div class="screen">

        <div class="channels">

            <div class="traces">

                <div class="channel">
                    <div class="label heart-label">
                        HEART RATE
                        <span class="unit">BPM</span>
                    </div>
                    <canvas id="heart"></canvas>
                </div>

                <div class="channel">
                    <div class="label pressure-label">
                        BLOOD PRESSURE
                        <span class="unit">mmHg</span>
                    </div>
                    <canvas id="pressure"></canvas>
                </div>

                <div class="channel">
                    <div class="label resp-label">
                        RESPIRATION
                        <span class="unit">RPM</span>
                    </div>
                    <canvas id="respiration"></canvas>
                </div>

                <div class="channel">
                    <div class="label skin-label">
                        SKIN CONDUCTANCE
                        <span class="unit">µS</span>
                    </div>
                    <canvas id="skin"></canvas>
                </div>

            </div>

            <div class="readouts">

                <div class="readout">
                    <div class="readout-name">BPM</div>
                    <div class="readout-value green" id="bpm">72</div>
                </div>

                <div class="readout">
                    <div class="readout-name">SYS / DIA</div>
                    <div class="readout-value red">
                        <span id="sys">118</span> /
                        <span id="dia">76</span>
                    </div>
                </div>

                <div class="readout">
                    <div class="readout-name">RPM</div>
                    <div class="readout-value blue" id="rpm">16</div>
                </div>

                <div class="readout">
                    <div class="readout-name">µS</div>
                    <div class="readout-value yellow" id="microsiemens">2.4</div>
                </div>

            </div>
        </div>
    </div>

    <div class="verdict" id="verdict">
        <div class="verdict-text" id="verdictText"></div>
    </div>

</div>

<script>

const canvases = {
    heart: document.getElementById("heart"),
    pressure: document.getElementById("pressure"),
    respiration: document.getElementById("respiration"),
    skin: document.getElementById("skin")
};

const ctx = {};

for (const key in canvases) {
    ctx[key] = canvases[key].getContext("2d");
}

let running = true;
let animationId = null;
let time = 0;

function resizeCanvas(canvas) {

    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;

    canvas.getContext("2d")
        .setTransform(ratio,0,0,ratio,0,0);
}

function resizeAll() {
    Object.values(canvases).forEach(resizeCanvas);
}

window.addEventListener("resize",resizeAll);
