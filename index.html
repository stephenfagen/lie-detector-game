<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polygraph Monitor</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010406;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    width: 100vw;
    height: 100vh;
}

/* =========================================
   MAIN MACHINE
========================================= */

.monitor {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            145deg,
            #172127,
            #060b0e 45%,
            #11191e
        );
}

/* =========================================
   TOP BAR
========================================= */

.topbar {
    flex: 0 0 64px;

    display: flex;
    align-items: center;

    padding: 0 28px;

    border-bottom: 2px solid #26343c;

    background:
        linear-gradient(
            #172128,
            #090e12
        );

    letter-spacing: 2px;
}

.status-light {
    width: 12px;
    height: 12px;

    flex: 0 0 12px;

    border-radius: 50%;

    background: #2bea78;

    box-shadow:
        0 0 14px #2bea78;

    margin-right: 15px;
}

.title {
    font-size: 20px;
    color: #dce5e9;
}

.recording {
    margin-left: auto;

    color: #9daab0;

    font-size: 13px;
    letter-spacing: 1px;
}

.record-dot {
    display: inline-block;

    width: 9px;
    height: 9px;

    margin-right: 8px;

    border-radius: 50%;

    background: #ed3535;

    box-shadow:
        0 0 10px #ed3535;

    animation: recordPulse 1s infinite;
}

@keyframes recordPulse {
    50% {
        opacity: .3;
    }
}

/* =========================================
   SCREEN
========================================= */

.screen {
    flex: 1 1 auto;

    min-height: 0;

    margin: 16px;

    border: 2px solid #263b45;

    border-radius: 7px;

    background: #02080b;

    overflow: hidden;
}

.channels {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        190px;

    min-height: 0;
}

/* =========================================
   WAVEFORM AREA
========================================= */

.traces {
    position: relative;

    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-rows:
        repeat(4, minmax(0, 1fr));
}

.channel {
    position: relative;

    min-height: 0;
    min-width: 0;

    overflow: hidden;

    border-bottom: 1px solid #173039;

    background-image:
        linear-gradient(
            rgba(35,83,99,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(35,83,99,.18) 1px,
            transparent 1px
        );

    background-size: 25px 25px;
}

.channel:last-child {
    border-bottom: none;
}

.channel canvas {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;
}

.label {
    position: absolute;

    z-index: 5;

    top: 14px;
    left: 20px;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 1px;

    pointer-events: none;

    text-shadow:
        0 1px 3px #000;
}

.unit {
    display: block;

    margin-top: 4px;

    font-size: 10px;

    font-weight: normal;

    opacity: .7;
}

.heart-label {
    color: #35ee78;
}

.pressure-label {
    color: #ff4242;
}

.resp-label {
    color: #31aaff;
}

.skin-label {
    color: #ffd429;
}

/* =========================================
   NUMERICAL PANEL
========================================= */

.readouts {
    min-height: 0;

    display: grid;

    grid-template-rows:
        repeat(4, minmax(0, 1fr));

    border-left: 2px solid #173039;

    background: #04090c;
}

.readout {
    min-height: 0;

    padding: 16px;

    border-bottom: 1px solid #182a32;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.readout:last-child {
    border-bottom: none;
}

.readout-name {
    color: #78878e;

    font-size: 11px;

    letter-spacing: 1px;
}

.readout-value {
    margin-top: 8px;

    font-family:
        "Courier New",
        monospace;

    font-size: 34px;

    line-height: 1;
}

.green {
    color: #38e875;
}

.red {
    color: #ff3c3c;
}

.blue {
    color: #35aaff;
}

.yellow {
    color: #ffd52a;
}

/* =========================================
   ANALYSIS
========================================= */

.analysis {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    width: min(360px, 80%);

    padding: 18px 25px;

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 5px;

    background:
        rgba(2,8,11,.92);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.7);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s;
}

.analysis.visible {
    opacity: 1;
}

.analysis-title {
    font-size: 15px;

    letter-spacing: 4px;

    color: #d5e0e4;
}

.analysis-status {
    margin-top: 9px;

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;

    color: #55df8a;
}

.confidence {
    margin-top: 14px;

    height: 5px;

    background: #16252b;

    overflow: hidden;

    border-radius: 4px;
}

.confidence-bar {
    height: 100%;

    width: 0%;

    background: #42df80;

    box-shadow:
        0 0 8px #42df80;
}

/* =========================================
   VERDICT
========================================= */

.verdict {
    flex: 0 0 150px;

    margin: 0 16px 16px;

    border:
        3px solid
        #263941;

    border-radius: 10px;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #04090b;

    transition:
        background .2s,
        border-color .2s,
        box-shadow .2s;
}

.verdict-text {
    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(60px, 10vw, 115px);

    letter-spacing: 10px;

    color: #26343a;

    transition:
        color .2s,
        text-shadow .2s;
}

/* =========================================
   LIE
========================================= */

.verdict.lie {
    border-color: #a01818;

    background:
        radial-gradient(
            circle,
            rgba(220,0,0,.45),
            transparent 68%
        ),
        #170203;

    box-shadow:
        inset 0 0 45px
        rgba(255,0,0,.25),

        0 0 25px
        rgba(255,0,0,.15);
}

.verdict.lie .verdict-text {
    color: #ff2222;

    text-shadow:
        0 0 8px #ff2222,
        0 0 25px #ff0000,
        0 0 50px
        rgba(255,0,0,.6);
}

/* =========================================
   TRUE
========================================= */

.verdict.true {
    border-color: #15713d;

    background:
        radial-gradient(
            circle,
            rgba(0,180,75,.3),
            transparent 68%
        ),
        #031009;

    box-shadow:
        inset 0 0 40px
        rgba(0,255,100,.13);
}

.verdict.true .verdict-text {
    color: #34ed79;

    text-shadow:
        0 0 8px #34ed79,
        0 0 25px
        rgba(0,255,100,.65);
}

/* =========================================
   HIDDEN OPERATOR PANEL
========================================= */

.operator {
    position: fixed;

    z-index: 100;

    top: 20px;
    left: 20px;

    width: 280px;

    padding: 18px;

    border:
        1px solid
        #4b5c64;

    border-radius: 8px;

    background:
        rgba(7,13,17,.97);

    box-shadow:
        0 15px 50px #000;

    display: none;
}

.operator.open {
    display: block;
}

.operator h3 {
    margin:
        0 0 14px;

    font-size: 14px;

    letter-spacing: 2px;
}

.operator button {
    width: 100%;

    height: 42px;

    margin-top: 8px;

    border:
        1px solid
        #35464e;

    border-radius: 5px;

    background: #111c21;

    color: white;

    cursor: pointer;
}

.operator button:hover {
    background: #1b2a31;
}

.operator-status {
    margin-top: 13px;

    color: #89979d;

    font-size: 11px;

    line-height: 1.5;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

    .topbar {
        flex-basis: 48px;

        padding:
            0 12px;
    }

    .title {
        font-size: 14px;
    }

    .recording {
        font-size: 10px;
    }

    .screen {
        margin: 8px;
    }

    .channels {
        grid-template-columns:
            minmax(0, 1fr)
            105px;
    }

    .readout {
        padding: 9px;
    }

    .readout-value {
        font-size: 22px;
    }

    .label {
        left: 10px;
        top: 9px;
        font-size: 9px;
    }

    .unit {
        font-size: 8px;
    }

    .verdict {
        flex-basis: 95px;

        margin:
            0 8px 8px;
    }
}
</style>
</head>


<body>

<div class="monitor">

    <!-- =====================================
         TOP BAR
    ====================================== -->

    <div class="topbar">

        <div class="status-light"></div>

        <div class="title">
            POLYGRAPH MONITOR
        </div>

        <div class="recording">

            <span class="record-dot"></span>

            RECORDING...

        </div>

    </div>


    <!-- =====================================
         MAIN SCREEN
    ====================================== -->

    <div class="screen">

        <div class="channels">

            <!-- =================================
                 WAVEFORMS
            ================================== -->

            <div class="traces">


                <!-- HEART RATE -->

                <div class="channel">

                    <div
                        class="label heart-label">

                        HEART RATE

                        <span class="unit">
                            BPM
                        </span>

                    </div>

                    <canvas
                        id="heart">
                    </canvas>

                </div>


                <!-- BLOOD PRESSURE -->

                <div class="channel">

                    <div
                        class="label pressure-label">

                        BLOOD PRESSURE

                        <span class="unit">
                            mmHg
                        </span>

                    </div>

                    <canvas
                        id="pressure">
                    </canvas>

                </div>


                <!-- RESPIRATION -->

                <div class="channel">

                    <div
                        class="label resp-label">

                        RESPIRATION

                        <span class="unit">
                            RPM
                        </span>

                    </div>

                    <canvas
                        id="respiration">
                    </canvas>

                </div>


                <!-- SKIN RESPONSE -->

                <div class="channel">

                    <div
                        class="label skin-label">

                        SKIN CONDUCTANCE

                        <span class="unit">
                            µS
                        </span>

                    </div>

                    <canvas
                        id="skin">
                    </canvas>

                </div>


                <!-- =================================
                     ANALYSIS OVERLAY
                ================================== -->

                <div
                    class="analysis"
                    id="analysis">

                    <div class="analysis-title">
                        ANALYZING
                    </div>

                    <div
                        class="analysis-status"
                        id="analysisStatus">

                        ANALYZING
                        PHYSIOLOGICAL RESPONSE

                    </div>

                    <div class="confidence">

                        <div
                            class="confidence-bar"
                            id="confidenceBar">
                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================
                 NUMERICAL READOUTS
            ================================== -->

            <div class="readouts">


                <div class="readout">

                    <div class="readout-name">
                        BPM
                    </div>

                    <div
                        class="readout-value green"
                        id="bpm">

                        72

                    </div>

                </div>


                <div class="readout">

                    <div class="readout-name">
                        SYS / DIA
                    </div>

                    <div
                        class="readout-value red">

                        <span id="sys">
                            118
                        </span>

                        /

                        <span id="dia">
                            76
                        </span>

                    </div>

                </div>


                <div class="readout">

                    <div class="readout-name">
                        RPM
                    </div>

                    <div
                        class="readout-value blue"
                        id="rpm">

                        16

                    </div>

                </div>


                <div class="readout">

                    <div class="readout-name">
                        µS
                    </div>

                    <div
                        class="readout-value yellow"
                        id="microsiemens">

                        2.4

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================
         VERDICT
    ====================================== -->

    <div
        class="verdict"
        id="verdict">

        <div
            class="verdict-text"
            id="verdictText">
        </div>

    </div>

</div>


<!-- =========================================
     HIDDEN OPERATOR PANEL

     CTRL + SHIFT + O
========================================= -->

<div
    class="operator"
    id="operator">

    <h3>
        OPERATOR CONTROL
    </h3>

    <button id="forceLie">
        FORCE LIE
    </button>

    <button id="forceTrue">
        FORCE TRUE
    </button>

    <button id="automatic">
        AUTOMATIC MODE
    </button>

    <div
        class="operator-status"
        id="operatorStatus">

        Mode:
        <b>Automatic</b>

    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const canvases = {

    heart:
        document.getElementById("heart"),

    pressure:
        document.getElementById("pressure"),

    respiration:
        document.getElementById("respiration"),

    skin:
        document.getElementById("skin")

};

const ctx = {};

for(const key in canvases) {

    ctx[key] =
        canvases[key].getContext("2d");

}

const verdict =
    document.getElementById("verdict");

const verdictText =
    document.getElementById("verdictText");

const analysis =
    document.getElementById("analysis");

const confidenceBar =
    document.getElementById("confidenceBar");

const analysisStatus =
    document.getElementById("analysisStatus");

const operator =
    document.getElementById("operator");

let running = true;

let analyzing = false;

let time = 0;

let animationId = null;

let forcedResult = null;


/* =========================================
   CANVAS SIZING
========================================= */

function resizeCanvas(canvas) {

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width * ratio
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height * ratio
            )
        );

    canvas
        .getContext("2d")
        .setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );
}


function resizeAll() {

    Object
        .values(canvases)
        .forEach(resizeCanvas);

}


window.addEventListener(
    "resize",
    resizeAll
);


/*
   Let the browser finish the initial
   CSS layout before measuring canvases.
*/

requestAnimationFrame(
    resizeAll
);


/* =========================================
   ECG WAVEFORM
========================================= */

function ecgWave(position) {

    let y = 0;


    /*
       Tiny baseline electrical noise.
    */

    y +=
        Math.sin(
            position * .10
        ) * .7;


    /*
       P wave
    */

    if(
        position > 10 &&
        position < 22
    ) {

        y -=
            Math.sin(
                (position - 10) /
                12 *
                Math.PI
            ) * 5;

    }


    /*
       Q wave
    */

    if(
        position >= 30 &&
        position < 34
    ) {

        y +=
            (position - 30) * 2.5;

    }


    /*
       R wave
    */

    if(
        position >= 34 &&
        position < 39
    ) {

        y -=
            (position - 34) * 19;

    }


    /*
       S wave
    */

    if(
        position >= 39 &&
        position < 45
    ) {

        y +=
            (position - 39) * 13;

    }


    /*
       T wave
    */

    if(
        position > 53 &&
        position < 72
    ) {

        y -=
            Math.sin(
                (position - 53) /
                19 *
                Math.PI
            ) * 7;

    }

    return y;
}


function drawECG() {

    const canvas =
        canvases.heart;

    const context =
        ctx.heart;

    const w =
        canvas.clientWidth;

    const h =
        canvas.clientHeight;

    if(
        w <= 0 ||
        h <= 0
    ) {
        return;
    }


    context.clearRect(
        0,
        0,
        w,
        h
    );


    const mid =
        h / 2 + 10;


    const phase =
        time * 115;


    context.beginPath();


    for(
        let x = 0;
        x <= w;
        x += 2
    ) {

        /*
           Slightly variable beat
           spacing gives subtle HRV.
        */

        const beatWidth =
            82 +
            Math.sin(
                time * .7
            ) * 3;


        const position =
            (x + phase) %
            beatWidth;


        const y =
            mid +
            ecgWave(position);


        if(x === 0) {

            context.moveTo(
                x,
                y
            );

        } else {

            context.lineTo(
                x,
                y
            );

        }

    }


    context.strokeStyle =
        "#37ed78";

    context.lineWidth = 2;

    context.shadowColor =
        "#37ed78";

    context.shadowBlur = 5;

    context.stroke();

    context.shadowBlur = 0;
}


/* =========================================
   BLOOD PRESSURE
========================================= */

function drawPressure() {

    const canvas =
        canvases.pressure;

    const context =
        ctx.pressure;

    const w =
        canvas.clientWidth;

    const h =
        canvas.clientHeight;

    if(
        w <= 0 ||
        h <= 0
    ) {
        return;
    }


    context.clearRect(
        0,
        0,
        w,
        h
    );


    const mid =
        h / 2 + 12;


    context.beginPath();


    for(
        let x = 0;
        x <= w;
        x += 2
    ) {

        const beat =
            (
                (x + time * 115)
                % 82
            ) / 82;


        let pulse;


        /*
           Rapid systolic rise.
        */

        if(
            beat < .17
        ) {

            pulse =
                Math.sin(
                    beat /
                    .17 *
                    Math.PI /
                    2
                ) * 39;

        } else {

            /*
               Diastolic decay.
            */

            pulse =
                39 *
                Math.exp(
                    -(beat - .17) *
                    4.2
                );

        }


        /*
           Small dicrotic notch.
        */

        const dicrotic =
            beat > .43 &&
            beat < .51

            ?

            -4 *
            Math.sin(
                (beat - .43) /
                .08 *
                Math.PI
            )

            :

            0;


        const noise =
            Math.sin(
                x * .08 +
                time * 2
            ) * .7;


        const y =
            mid -
            pulse +
            dicrotic +
            noise;


        if(x === 0) {

            context.moveTo(
                x,
                y
            );

        } else {

            context.lineTo(
                x,
                y
            );

        }

    }


    context.strokeStyle =
        "#ff4141";

    context.lineWidth = 1.8;

    context.shadowColor =
        "#ff4141";

    context.shadowBlur = 4;

    context.stroke();

    context.shadowBlur = 0;
}


/* =========================================
   RESPIRATION
========================================= */

function drawRespiration() {

    const canvas =
        canvases.respiration;

    const context =
        ctx.respiration;

    const w =
        canvas.clientWidth;

    const h =
        canvas.clientHeight;

    if(
        w <= 0 ||
        h <= 0
    ) {
        return;
    }


    context.clearRect(
        0,
        0,
        w,
        h
    );


    context.beginPath();


    for(
        let x = 0;
        x <= w;
        x += 2
    ) {

        const shifted =
            x +
            time * 23;


        const main =
            Math.sin(
                shifted / 48
            );


        const secondary =
            Math.sin(
                shifted / 15
            ) * 1.3;


        const y =
            h / 2 +
            main * 27 +
            secondary;


        if(x === 0) {

            context.moveTo(
                x,
                y
            );

        } else {

            context.lineTo(
                x,
                y
            );

        }

    }


    context.strokeStyle =
        "#28a9ff";

    context.lineWidth = 1.8;

    context.shadowColor =
        "#28a9ff";

    context.shadowBlur = 4;

    context.stroke();

    context.shadowBlur = 0;
}


/* =========================================
   SKIN CONDUCTANCE
========================================= */

function drawSkin() {

    const canvas =
        canvases.skin;

    const context =
        ctx.skin;

    const w =
        canvas.clientWidth;

    const h =
        canvas.clientHeight;

    if(
        w <= 0 ||
        h <= 0
    ) {
        return;
    }


    context.clearRect(
        0,
        0,
        w,
        h
    );


    context.beginPath();


    for(
        let x = 0;
        x <= w;
        x += 2
    ) {

        const shifted =
            x +
            time * 30;


        const baseline =
            Math.sin(
                shifted * .035
            ) * 2;


        const slow =
            Math.sin(
                shifted * .011
            ) * 3;


        const response =
            Math.max(
                0,
                Math.sin(
                    shifted * .018
                )
            ) ** 9 * 12;


        const noise =
            Math.sin(
                shifted * .3
            ) * .8;


        const y =
            h / 2 +
            baseline +
            slow -
            response +
            noise;


        if(x === 0) {

            context.moveTo(
                x,
                y
            );

        } else {

            context.lineTo(
                x,
                y
            );

        }

    }


    context.strokeStyle =
        "#ffd426";

    context.lineWidth = 1.6;

    context.shadowColor =
        "#ffd426";

    context.shadowBlur = 3;

    context.stroke();

    context.shadowBlur = 0;
}


/* =========================================
   AUDIO CONTEXT
========================================= */

function createAudioContext() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) {
        return null;
    }

    return new AudioContext();
}


/* =========================================
   LIE BUZZER
========================================= */

function playLieAlarm() {

    const audio = createAudioContext();

    if(!audio) {
        return;
    }

    const now = audio.currentTime;

    /*
       ONE continuous extended buzzer.
       Fixed low pitch, harsh electronic/mechanical tone.
       No sweep, no notes, no separate sound effects.
    */

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(112, now);

    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(.62, now + .008);
    gain.gain.setValueAtTime(.62, now + 1.02);
    gain.gain.exponentialRampToValueAtTime(.0001, now + 1.04);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(now);
    osc.stop(now + 1.06);

    /*
       Add fixed harmonics through separate oscillators.
       They remain at the same pitch for the entire buzzer.
    */

    const harmonic2 = audio.createOscillator();
    const harmonic2Gain = audio.createGain();

    harmonic2.type = "square";
    harmonic2.frequency.setValueAtTime(224, now);

    harmonic2Gain.gain.setValueAtTime(.0001, now);
    harmonic2Gain.gain.exponentialRampToValueAtTime(.17, now + .008);
    harmonic2Gain.gain.setValueAtTime(.17, now + 1.02);
    harmonic2Gain.gain.exponentialRampToValueAtTime(.0001, now + 1.04);

    harmonic2.connect(harmonic2Gain);
    harmonic2Gain.connect(audio.destination);

    harmonic2.start(now);
    harmonic2.stop(now + 1.06);

    /*
       Low-frequency body gives the buzzer its
       heavy TV/game-show ERRRR character.
    */

    const low = audio.createOscillator();
    const lowGain = audio.createGain();

    low.type = "sine";
    low.frequency.setValueAtTime(56, now);

    lowGain.gain.setValueAtTime(.0001, now);
    lowGain.gain.exponentialRampToValueAtTime(.20, now + .008);
    lowGain.gain.setValueAtTime(.20, now + 1.02);
    lowGain.gain.exponentialRampToValueAtTime(.0001, now + 1.04);

    low.connect(lowGain);
    lowGain.connect(audio.destination);

    low.start(now);
    low.stop(now + 1.06);
}


/* =========================================
   TRUE SOUND
========================================= */

function playTrueSound() {

    const audio = createAudioContext();

    if(!audio) {
        return;
    }

    const now = audio.currentTime;

    /*
       QUIZ-SHOW CORRECT ANSWER:
       DING — DING — DING!

       Three separate bright bell hits.
       The notes are intentionally the SAME pitch:
       this is not a musical scale.
       The final DING is slightly stronger/longer.
    */

    const dings = [
        { offset: 0.00, frequency: 880,  volume: .28, decay: 11 },
        { offset: 0.20, frequency: 880,  volume: .32, decay: 10 },
        { offset: 0.40, frequency: 880,  volume: .48, decay: 7.5 }
    ];

    dings.forEach(ding => {

        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(
            ding.frequency,
            now + ding.offset
        );

        const start = now + ding.offset;

        gain.gain.setValueAtTime(
            .001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            ding.volume,
            start + .003
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            start + .42
        );

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.start(start);
        osc.stop(start + .46);
    });

    /*
       Subtle bell harmonics make the DING sound
       more like a quiz/game-show chime.
    */

    const finalStart = now + .40;

    [1760, 2640].forEach((frequency, index) => {

        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(
            frequency,
            finalStart
        );

        gain.gain.setValueAtTime(
            .001,
            finalStart
        );

        gain.gain.exponentialRampToValueAtTime(
            index === 0 ? .12 : .055,
            finalStart + .003
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            finalStart + .32
        );

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.start(finalStart);
        osc.stop(finalStart + .36);
    });
}


/* =========================================
   ANALYSIS
========================================= */

function beginAnalysis(result) {

    if(
        !running ||
        analyzing
    ) {
        return;
    }


    analyzing = true;


    analysis.classList.add(
        "visible"
    );


    confidenceBar.style.width =
        "0%";


    const duration =
        1800;


    const start =
        performance.now();


    function progress(now) {

        if(!analyzing) {
            return;
        }


        const elapsed =
            now - start;


        const percentage =
            Math.min(
                elapsed /
                duration *
                100,
                100
            );


        confidenceBar.style.width =
            percentage + "%";


        if(
            elapsed < 550
        ) {

            analysisStatus.textContent =
                "ANALYZING PHYSIOLOGICAL RESPONSE";

        }

        else if(
            elapsed < 1150
        ) {

            analysisStatus.textContent =
                "COMPARING RESPONSE PATTERNS";

        }

        else if(
            elapsed < duration
        ) {

            analysisStatus.textContent =
                "CALCULATING RESULT";

        }

        else {

            finishResult(
                result
            );

            return;
        }


        requestAnimationFrame(
            progress
        );
    }


    requestAnimationFrame(
        progress
    );
}


/* =========================================
   RESULT
========================================= */

function finishResult(result) {

    analyzing = false;

    running = false;


    analysis.classList.remove(
        "visible"
    );


    verdict.classList.remove(
        "lie",
        "true"
    );


    if(result === "lie") {

        verdict.classList.add(
            "lie"
        );

        verdictText.textContent =
            "LIE";


        playLieAlarm();

    }

    else {

        verdict.classList.add(
            "true"
        );

        verdictText.textContent =
            "TRUE";


        playTrueSound();
    }
}


/* =========================================
   CHOOSE RESULT
========================================= */

function chooseResult(requested) {

    const result =
        forcedResult ||
        requested;


    beginAnalysis(
        result
    );
}


/* =========================================
   ANIMATION
========================================= */

function animate() {

    if(!running) {
        return;
    }


    time += .016;


    drawECG();

    drawPressure();

    drawRespiration();

    drawSkin();


    /*
       Slightly increase variation during
       the analysis sequence.
    */

    const stress =
        analyzing
            ? Math.sin(time * 3) * 2
            : 0;


    const bpm =
        72 +
        Math.sin(time * .65) * 2.5 +
        Math.sin(time * 1.7) * 1.1 +
        stress;


    const sys =
        118 +
        Math.sin(time * .35) * 2 +
        stress * .5;


    const dia =
        76 +
        Math.sin(time * .4) * 1.4;


    const rpm =
        16 +
        Math.sin(time * .22) * 1.2;


    const skin =
        2.4 +
        Math.sin(time * .5) * .12 +
        Math.sin(time * 1.4) * .05;


    document.getElementById("bpm")
        .textContent =
        Math.round(bpm);


    document.getElementById("sys")
        .textContent =
        Math.round(sys);


    document.getElementById("dia")
        .textContent =
        Math.round(dia);


    document.getElementById("rpm")
        .textContent =
        Math.round(rpm);


    document.getElementById("microsiemens")
        .textContent =
        skin.toFixed(1);


    animationId =
        requestAnimationFrame(
            animate
        );
}


/* =========================================
   OPERATOR MODE
========================================= */

document
    .getElementById("forceLie")
    .addEventListener(
        "click",
        function() {

            forcedResult =
                "lie";


            document.getElementById(
                "operatorStatus"
            ).innerHTML =
                "Mode: <b>Forced LIE</b>";

        }
    );


document
    .getElementById("forceTrue")
    .addEventListener(
        "click",
        function() {

            forcedResult =
                "true";


            document.getElementById(
                "operatorStatus"
            ).innerHTML =
                "Mode: <b>Forced TRUE</b>";

        }
    );


document
    .getElementById("automatic")
    .addEventListener(
        "click",
        function() {

            forcedResult =
                null;


            document.getElementById(
                "operatorStatus"
            ).innerHTML =
                "Mode: <b>Automatic</b>";

        }
    );


/* =========================================
   KEYBOARD CONTROLS
=========================================

SPACE
    LIE

ENTER
    TRUE

R
    REFRESH PAGE

CTRL + SHIFT + O
    OPEN/CLOSE SECRET OPERATOR PANEL

========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        /* SECRET OPERATOR PANEL */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "o"
        ) {

            event.preventDefault();


            operator.classList.toggle(
                "open"
            );


            return;
        }


        /* REFRESH */

        if(
            event.key.toLowerCase() === "r"
        ) {

            event.preventDefault();


            location.reload();


            return;
        }


        /* LIE */

        if(
            event.code === "Space"
        ) {

            event.preventDefault();


            chooseResult(
                "lie"
            );


            return;
        }


        /* TRUE */

        if(
            event.code === "Enter"
        ) {

            event.preventDefault();


            chooseResult(
                "true"
            );


            return;
        }

    }
);


/* =========================================
   START
========================================= */

requestAnimationFrame(
    function() {

        resizeAll();

        animate();

    }
);

</script>
